# Pubblica l'app su GitHub Pages a ogni push su main.
#
# L'app sta nella radice del repository, che è anche ciò che Pages pubblica
# quando è configurato in modalità "Deploy from a branch". Così il sito
# funziona in entrambe le configurazioni: con Source su "GitHub Actions"
# pubblica questo workflow, con Source su un branch pubblica Jekyll, e in
# ogni caso viene servita la stessa index.html.
#
# Il file .nojekyll impedisce a Jekyll di rielaborare il contenuto e di
# servire il README al posto dell'app.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "logo-goi.png"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta. Se arriva un push mentre uno è in corso, quello
# vecchio viene annullato: va online sempre l'ultimo stato di main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepara l'artifact dalla radice del repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
