# Pubblica l'app su GitHub Pages a ogni push su main.
#
# Serve il contenuto di public/, la stessa cartella dichiarata in
# firebase.json: una sola copia dell'app, nessuna duplicazione da mantenere
# allineata a mano.
#
# Richiede che in Settings -> Pages la voce "Source" sia impostata su
# "GitHub Actions" (non su un branch): con l'impostazione a branch, Pages
# pubblica la radice del repository e serve il README invece dell'app.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta. Se arriva un push mentre uno è in corso, quello
# vecchio viene annullato: va online sempre l'ultimo stato di main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepara l'artifact dalla cartella public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
