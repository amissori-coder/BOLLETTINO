# Confronta l'app deployata su Firebase Hosting con quella versionata qui.
#
# Serve a intercettare le modifiche pubblicate fuori da Git: se qualcuno
# deploya senza committare, questo workflow mostra il diff e rende scaricabile
# la copia deployata, così la si può reintegrare nel repository.
#
# Si avvia solo manualmente: Actions -> "Confronta con il deploy su Hosting".
# Non legge segreti e non tocca il database: solo GET su file pubblici.
name: Confronta con il deploy su Hosting

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL pubblico del sito"
        required: true
        default: "https://gestionale-collegio-lazio.web.app"

permissions:
  contents: read

jobs:
  confronta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scarica l'app deployata
        run: node tools/recover-from-hosting.mjs "${{ inputs.url }}" recovered

      - name: Confronta con public/
        id: diff
        run: |
          echo '## Differenze tra il deploy e `public/`' >> "$GITHUB_STEP_SUMMARY"
          if diff -rq public recovered/dist > differenze.txt 2>&1; then
            echo 'Nessuna differenza: il deploy corrisponde al codice versionato.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'Il deploy **non** corrisponde al codice versionato:'
              echo '```'
              cat differenze.txt
              echo '```'
              echo '### Diff di index.html'
              echo '```diff'
              diff -u public/index.html recovered/dist/index.html | head -500 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "divergente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rendi scaricabile la copia deployata
        if: steps.diff.outputs.divergente == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-deployata
          path: recovered/dist

      - name: Segnala la divergenza
        if: steps.diff.outputs.divergente == 'true'
        run: |
          echo "::warning::Il deploy su Hosting diverge dal codice in public/. Vedi il riepilogo e l'artifact."
